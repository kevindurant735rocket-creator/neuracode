version: '3.8'

services:
  neuracode:
    build: .
    container_name: neuracode
    volumes:
      - ./:/workspace
      - neuracode-data:/home/neuracode/.neuracode
    environment:
      - RUST_LOG=info
      - NEURACODE_CACHE_SIZE=512
    command: ["serve", "--port", "8000"]
    ports:
      - "8000:8000"
    restart: unless-stopped

  neuracode-web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: neuracode-web
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8000
    depends_on:
      - neuracode
    restart: unless-stopped

volumes:
  neuracode-data:
