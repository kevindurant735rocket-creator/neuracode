services:
  neuracode:
    build: .
    container_name: neuracode
    volumes:
      - ./:/workspace
      - neuracode-data:/home/neuracode/.neuracode
    environment:
      - RUST_LOG=info
      - NEURACODE_CACHE_SIZE=512
    # MCP uses stdio transport; `serve` execs the neuracode-mcp binary.
    command: ["serve"]
    stdin_open: true
    tty: true
    restart: unless-stopped

  neuracode-web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: neuracode-web
    ports:
      - "3000:80"
    environment:
      # Vite reads VITE_* vars (REACT_APP_* is CRA-only and ignored).
      # NOTE: the web UI is a static preview in v0.1.x — not yet wired to an HTTP API.
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - neuracode
    restart: unless-stopped

volumes:
  neuracode-data:
