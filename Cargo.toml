[workspace]
members = [
    "crates/neuracode-core",
    "crates/neuracode-cli",
    "crates/neuracode-mcp",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["NeuraCode Team"]
description = "The Next-Generation AI Agent Cognitive Enhancement System"
homepage = "https://github.com/neuracode/neuracode"
repository = "https://github.com/neuracode/neuracode"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
clap = { version = "4", features = ["derive"] }
tree-sitter = "0.20"
tree-sitter-rust = "0.20"
tree-sitter-javascript = "0.20"
tree-sitter-python = "0.20"
tree-sitter-typescript = "0.20"
tree-sitter-go = "0.20"
tree-sitter-java = "0.20"
tree-sitter-c = "0.20"
tree-sitter-cpp = "0.20"
rusqlite = { version = "0.30", features = ["bundled"] }
dashmap = "5"
parking_lot = "0.12"
rayon = "1.8"
futures = "0.3"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
regex = "1"
walkdir = "2"
ignore = "0.4"
toml = "0.8"
config = "0.13"
shellexpand = "3"
dirs = "5"
